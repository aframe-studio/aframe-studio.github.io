name: Deploy AFRAME site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html _site/
          for base in dot-and-key-sunscreen dossier-ambery-vanilla-selfie essence-one-morning-calm bean-and-bee-curl-custard; do
            if ls assets/$base.mp4.b64.part* >/dev/null 2>&1; then
              cat assets/$base.mp4.b64.part* | base64 -d > _site/$base.mp4
            else
              base64 -d assets/$base.mp4.b64 > _site/$base.mp4
            fi
          done
          ls -la _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
